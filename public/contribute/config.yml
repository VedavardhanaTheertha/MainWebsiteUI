          - { name: kn, label: Kannada Title, widget: string }
      - name: summary
        label: Story Synopsis
        widget: object
        fields:
          - { name: en, label: English Summary, widget: text }
          - { name: kn, label: Kannada Summary, widget: text }
      - { name: body, label: Story Narrative, widget: markdown }

  # ==========================================
  # 16. Stotras & Mantras (mantra)
  # ==========================================
  - name: mantra
    label: Stotras & Mantras
    folder: mantra
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title.en}} ({{title.kn}})"
    fields:
      - { name: id, label: Stotra / Mantra Identifier, widget: string }
      - name: title
        label: Stotra Title
        widget: object
        fields:
          - { name: en, label: English Title, widget: string }
          - { name: kn, label: Kannada Title, widget: string }
      - name: summary
        label: Significance & Phala-shruti
        widget: object
        fields:
          - { name: en, label: English Summary, widget: text }
          - { name: kn, label: Kannada Summary, widget: text }
      - { name: body, label: Stotra Verses & Meaning, widget: markdown }

  # ==========================================
  # 17. Presiding Deities (deities)
  # ==========================================
  - name: deities
    label: Presiding Deities
    folder: deities
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title.en}} ({{title.kn}})"
    fields:
      - { name: id, label: Deity Identifier, widget: string, required: false }
      - name: title
        label: Deity Name
        widget: object
        fields:
          - { name: en, label: English Name, widget: string }
          - { name: kn, label: Kannada Name, widget: string }
      - name: subtitle
        label: Subtitle / Attribute
        widget: object
        required: false
        fields:
          - { name: en, label: English Subtitle, widget: string }
          - { name: kn, label: Kannada Subtitle, widget: string }
      - name: attributes
        label: Iconography & Sacred Attributes
        widget: object
        required: false
        fields:
          - { name: en, label: English Attributes, widget: string }
          - { name: kn, label: Kannada Attributes, widget: string }
      - { name: body, label: Sacred Lore & Worship Tradition, widget: markdown }

  # ==========================================
  # 18. Matha Branches (branches)
  # ==========================================
  - name: branches
    label: Matha Branches
    folder: branches
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title.en}} ({{title.kn}})"
    fields:
      - { name: id, label: Branch Identifier, widget: string }
      - name: title
