  # ==========================================
  # 12. Shastra & Canonical Texts (shastra)
  # ==========================================
  - name: shastra
    label: Shastra & Canonical Texts
    folder: shastra
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title.en}} ({{title.kn}})"
    fields:
      - { name: id, label: Text Identifier, widget: string }
      - name: title
        label: Canonical Text Title
        widget: object
        fields:
          - { name: en, label: English Title, widget: string }
          - { name: kn, label: Kannada Title, widget: string }
      - name: summary
        label: Summary / Overview
        widget: object
        fields:
          - { name: en, label: English Summary, widget: text }
          - { name: kn, label: Kannada Summary, widget: text }
      - { name: body, label: Shastric Exposition, widget: markdown }

  # ==========================================
  # 13. Science & Wellbeing (science)
  # ==========================================
  - name: science
    label: Science & Wellbeing
    folder: science
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title.en}} ({{title.kn}})"
    fields:
      - { name: id, label: Topic Identifier, widget: string }
      - name: title
        label: Topic Title
        widget: object
        fields:
          - { name: en, label: English Title, widget: string }
          - { name: kn, label: Kannada Title, widget: string }
      - name: summary
        label: Summary
        widget: object
        fields:
          - { name: en, label: English Summary, widget: text }
          - { name: kn, label: Kannada Summary, widget: text }
      - { name: body, label: Science & Wellbeing Exposition, widget: markdown }

  # ==========================================
  # 14. Sacred Marks & Symbols (symbolism)
  # ==========================================
  - name: symbolism
    label: Sacred Marks & Symbols
    folder: symbolism
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title.en}} ({{title.kn}})"
    fields:
      - { name: id, label: Symbol Identifier, widget: string }
      - name: title
        label: Sacred Symbol Title
        widget: object
        fields:
          - { name: en, label: English Title, widget: string }
          - { name: kn, label: Kannada Title, widget: string }
      - name: summary
        label: Symbolic Meaning & Scriptural Context
        widget: object
        fields:
          - { name: en, label: English Summary, widget: text }
          - { name: kn, label: Kannada Summary, widget: text }
      - { name: body, label: Sacred Symbolism Exposition, widget: markdown }

  # ==========================================
  # 15. Matha & Puranic Stories (stories)
  # ==========================================
  - name: stories
    label: Matha & Puranic Stories
    folder: stories
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title.en}} ({{title.kn}})"
    fields:
      - { name: id, label: Story Identifier, widget: string }
      - name: title
        label: Story Title
        widget: object
