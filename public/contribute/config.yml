        widget: object
        fields:
          - { name: en, label: English Description, widget: string }
          - { name: kn, label: Kannada Description, widget: string }
      - name: items
        label: Photo Gallery Items
        widget: list
        required: false
        fields:
          - { name: small-webp, label: Thumbnail URL (small), widget: string }
          - { name: large-webp, label: Full Photo URL (large), widget: string }
      - { name: body, label: Notes & Context, widget: markdown, required: false }

  # ==========================================
  # 22. Learn & Courses (learn)
  # ==========================================
  - name: learn
    label: Learn & Courses
    folder: learn
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{translations.en.title}} ({{translations.kn.title}})"
    fields:
      - { name: id, label: Subject Identifier, widget: string }
      - name: translations
        label: Translations
        widget: object
        fields:
          - name: en
            label: English Details
            widget: object
            fields:
              - { name: title, label: Subject Title, widget: string }
              - { name: sub, label: Subtitle, widget: string, required: false }
              - { name: description, label: Description, widget: text }
              - { name: img, label: Image URL, widget: string, required: false }
          - name: kn
            label: Kannada Details
            widget: object
            fields:
              - { name: title, label: Subject Title, widget: string }
              - { name: sub, label: Subtitle, widget: string, required: false }
              - { name: description, label: Description, widget: text }
              - { name: img, label: Image URL, widget: string, required: false }
      - { name: enabled, label: Enabled on Website, widget: boolean, default: true }
      - { name: body, label: Course Curriculum & Lessons, widget: markdown, required: false }
