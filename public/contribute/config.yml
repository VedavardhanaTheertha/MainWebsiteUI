          - { name: kn, label: Kannada Title, widget: string }
      - name: summary
        label: Summary / Significance
        widget: object
        fields:
          - { name: en, label: English Summary, widget: text }
          - { name: kn, label: Kannada Summary, widget: text }
      - { name: image, label: Image URL, widget: string, required: false }
      - { name: body, label: Sanctuary Guide & Darshan Info, widget: markdown }

  # ==========================================
  # 11. Philosophy & Knowledge (jnana)
  # ==========================================
  - name: jnana
    label: Philosophy & Knowledge (Jnana)
    folder: jnana
    create: true
    slug: "{{slug}}"
    extension: md
