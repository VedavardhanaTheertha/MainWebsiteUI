  # ==========================================
  # 20. Social & Connect Channels (connect)
  # ==========================================
  - name: connect
    label: Social & Connect Channels
    folder: connect
    create: true
    slug: "{{order}}-{{id}}"
    extension: md
    format: frontmatter
    summary: "{{platform}} — {{handle}}"
    fields:
      - { name: id, label: Channel ID, widget: string }
      - { name: order, label: Sort Order, widget: number, value_type: int }
      - { name: platform, label: Platform Name, widget: string }
      - { name: handle, label: Handle / Username, widget: string }
      - { name: url, label: Profile / Channel URL, widget: string }
      - { name: audience, label: Followers / Audience, widget: string, required: false }
      - { name: brand_color, label: Brand Color Code, widget: string, required: false }
      - { name: enabled, label: Enabled on Connect Page, widget: boolean, default: true }
      - { name: body, label: Additional Channel Details, widget: markdown, required: false }

  # ==========================================
  # 21. Photo Albums (albums)
  # ==========================================
  - name: albums
    label: Photo Albums & Galleries
    folder: albums
    create: true
    slug: "{{date}}-{{id}}"
    extension: md
    format: frontmatter
    summary: "{{date}} — {{title.en}} ({{title.kn}})"
    fields:
      - { name: id, label: Album Identifier, widget: string }
      - { name: date, label: Event Date, widget: datetime, type: date }
      - { name: cover, label: Cover Image URL (R2 CDN), widget: string }
