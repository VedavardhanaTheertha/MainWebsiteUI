<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Events Auspicious Temple Bell">
  <defs>
    <linearGradient id="eve_gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="eve_brass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="30%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#9A7D0A" />
    </linearGradient>
    <linearGradient id="eve_leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="60%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
  </defs>

  <!-- Festive Mango Leaf & Marigold Torana (Top Garlands) -->
  <!-- Mango Leaves (Amrapallava) -->
  <path d="M 12 4 C 15 2 21 6 22 10 C 18 10 13 8 12 4 Z" fill="url(#eve_leaf)" />
  <path d="M 52 4 C 49 2 43 6 42 10 C 46 10 51 8 52 4 Z" fill="url(#eve_leaf)" />
  <!-- Marigold Flower Garland (Genda Phool) -->
  <path d="M 10 9 Q 32 16 54 9" fill="none" stroke="#EA580C" stroke-width="1.6" stroke-dasharray="3 3" />
  <circle cx="16" cy="10.5" r="2.8" fill="#F59E0B" stroke="#B45309" stroke-width="0.5" />
  <circle cx="24" cy="12.5" r="2.8" fill="#EA580C" stroke="#78350F" stroke-width="0.5" />
  <circle cx="32" cy="13.2" r="3.2" fill="#FDE047" stroke="#B45309" stroke-width="0.6" />
  <circle cx="40" cy="12.5" r="2.8" fill="#EA580C" stroke="#78350F" stroke-width="0.5" />
  <circle cx="48" cy="10.5" r="2.8" fill="#F59E0B" stroke="#B45309" stroke-width="0.5" />

  <!-- Bell Suspension Chain & Ring -->
  <circle cx="32" cy="6" r="3" fill="none" stroke="url(#eve_gold)" stroke-width="1.8" />
  <rect x="30.5" y="8" width="3" height="6" fill="url(#eve_gold)" rx="1" />

  <!-- Sacred Bell Handle / Crest (Garuda/Chakra Finial) -->
  <path d="M 28 14 C 28 11 36 11 36 14 L 37 18 L 27 18 Z" fill="url(#eve_gold)" />
  <circle cx="32" cy="14" r="1.4" fill="#B71C1C" />

  <!-- Upper Bell Dome / Shoulder -->
  <path d="M 26 18 C 26 17 38 17 38 18 C 42 24 45 32 47 41 L 17 41 C 19 32 22 24 26 18 Z" fill="url(#eve_brass)" stroke="#78350F" stroke-width="0.8" />

  <!-- Engraved Decorative Bands on Bell Body -->
  <path d="M 23 25 C 26 23.5 38 23.5 41 25" fill="none" stroke="#FEF08A" stroke-width="1.2" />
  <path d="M 20 32 C 24 30.5 40 30.5 44 32" fill="none" stroke="#FEF08A" stroke-width="1.2" />
  <circle cx="28" cy="31.2" r="0.8" fill="#78350F" />
  <circle cx="32" cy="31" r="0.9" fill="#B71C1C" />
  <circle cx="36" cy="31.2" r="0.8" fill="#78350F" />

  <!-- Flared Bell Lip / Rim (Wide Musical Flange) -->
  <path d="M 17 41 C 15 45 13 47 11 50 C 18 53.5 46 53.5 53 50 C 51 47 49 45 47 41 Z" fill="url(#eve_gold)" stroke="#78350F" stroke-width="0.8" />
  <ellipse cx="32" cy="50.5" rx="21" ry="4" fill="url(#eve_gold)" stroke="#78350F" stroke-width="0.8" />
  <ellipse cx="32" cy="50.5" rx="19.5" ry="2.8" fill="#582305" />

  <!-- Bell Clapper (Lolak / Swinging Tongue) -->
  <path d="M 31 46 L 31 54 C 29 54 29 59 32 59 C 35 59 35 54 33 54 L 33 46 Z" fill="url(#eve_gold)" stroke="#78350F" stroke-width="0.7" />
  <circle cx="32" cy="57" r="2.8" fill="url(#eve_gold)" />
  <circle cx="32" cy="57" r="1.2" fill="#FEF08A" />

  <!-- Auspicious Divine Sound Resonance Waves (Nada-Brahma) -->
  <path d="M 7 42 C 4 45 4 52 7 56" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 4 38 C 0 43 0 55 4 60" fill="none" stroke="#F59E0B" stroke-width="1.4" stroke-linecap="round" opacity="0.6" />
  <path d="M 57 42 C 60 45 60 52 57 56" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 60 38 C 64 43 64 55 60 60" fill="none" stroke="#F59E0B" stroke-width="1.4" stroke-linecap="round" opacity="0.6" />
</svg>