<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Seva Mangalarathi Diya">
  <defs>
    <radialGradient id="sev_glow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#FDE047" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#F97316" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sev_gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="sev_flameOuter" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="45%" stop-color="#EA580C" />
      <stop offset="80%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <linearGradient id="sev_flameInner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="40%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>

  <!-- Radiant Aura of Divine Light -->
  <circle cx="32" cy="19" r="18" fill="url(#sev_glow)" />

  <!-- Sacred Camphor Flame (Karpura Jyoti) -->
  <!-- Outer Flame Body -->
  <path d="M 32 4 C 36 10 40 16 38 22 C 36 27 28 27 26 22 C 24 16 28 10 32 4 Z" fill="url(#sev_flameOuter)" />
  <!-- Dynamic Licking Flame Tips -->
  <path d="M 34 8 C 37 13 36 18 33 22 C 38 20 38 14 34 8 Z" fill="#FDE047" opacity="0.8" />
  <!-- Inner White-Hot Flame Core -->
  <path d="M 32 10 C 34.5 14 35.5 19 34 22 C 33 24 31 24 30 22 C 28.5 19 29.5 14 32 10 Z" fill="url(#sev_flameInner)" />
  <!-- Flame Core Teardrop -->
  <ellipse cx="32" cy="21.5" rx="2" ry="2.8" fill="#FFFFFF" />

  <!-- Brass Lamp Bowl (Deepa Patra / Oil Vessel) -->
  <!-- Upper Lip / Rim -->
  <ellipse cx="32" cy="27" rx="23" ry="5.5" fill="url(#sev_gold)" stroke="#78350F" stroke-width="0.8" />
  <ellipse cx="32" cy="26" rx="21" ry="4" fill="#B45309" />
  <!-- Ghee / Oil Surface with Warm Reflection -->
  <ellipse cx="32" cy="26.2" rx="19" ry="3.2" fill="#D97706" />

  <!-- Lamp Main Cup Basin -->
  <path d="M 9 27 C 12 37 22 41 32 41 C 42 41 52 37 55 27 Z" fill="url(#sev_gold)" stroke="#78350F" stroke-width="0.8" />

  <!-- Engraved Temple Petal Carvings on Lamp Exterior -->
  <path d="M 17 31 C 21 37 25 39 32 40 C 39 39 43 37 47 31" fill="none" stroke="#FEF08A" stroke-width="1.2" stroke-linecap="round" />
  <circle cx="24" cy="35" r="1.1" fill="#78350F" />
  <circle cx="32" cy="36.5" r="1.3" fill="#B71C1C" />
  <circle cx="40" cy="35" r="1.1" fill="#78350F" />

  <!-- Ornate Brass Pillar Stem -->
  <rect x="29" y="41" width="6" height="7" fill="url(#sev_gold)" stroke="#78350F" stroke-width="0.6" />
  <!-- Molded Rib Ring -->
  <rect x="27.5" y="44" width="9" height="2" rx="1" fill="#FEF08A" stroke="#78350F" stroke-width="0.5" />

  <!-- Stepped Traditional Pedestal (Kurma Pitha / Circular Base) -->
  <path d="M 23 48 L 41 48 L 43 53 L 21 53 Z" fill="url(#sev_gold)" stroke="#78350F" stroke-width="0.6" />
  <path d="M 16 53.5 L 48 53.5 L 50 58.5 L 14 58.5 Z" fill="url(#sev_gold)" stroke="#78350F" stroke-width="0.7" />
  <rect x="13" y="58.5" width="38" height="2.5" rx="1.2" fill="#78350F" />

  <!-- Auspicious Marigold & Jasmine Flower Offerings at the Base -->
  <circle cx="16" cy="57" r="3.2" fill="#EA580C" />
  <circle cx="16" cy="57" r="1.5" fill="#FDE047" />
  <circle cx="48" cy="57" r="3.2" fill="#EA580C" />
  <circle cx="48" cy="57" r="1.5" fill="#FDE047" />
  <circle cx="32" cy="59.5" r="2.2" fill="#E11D48" />
  <circle cx="32" cy="59.5" r="1" fill="#FFF1F2" />
</svg>