<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" stroke="#ea580c" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Connect with Matha">
  <!-- Sacred Kalasha / Gopuram Pinnacle on Top -->
  <path d="M 32 6 L 35 11 H 29 Z" fill="#ea580c"/>
  <circle cx="32" cy="13" r="2.5" fill="#ea580c" stroke="none"/>

  <!-- Grand Matha / Temple Gateway Arch (Mahadwara) -->
  <path d="M 10 56 V 26 C 10 14 54 14 54 26 V 56" fill="#ea580c" fill-opacity="0.08" stroke-width="4.5"/>
  <line x1="6" y1="56" x2="58" y2="56" stroke-width="4.5"/>

  <!-- Divine Connection / Darshan Rays from Above Sanctum -->
  <line x1="32" y1="18" x2="32" y2="24" stroke-width="3"/>
  <line x1="24" y1="21" x2="26" y2="26" stroke-width="3"/>
  <line x1="40" y1="21" x2="38" y2="26" stroke-width="3"/>

  <!-- Hands in Anjali Mudra / Pranam (Devotee in Reverent Connection with Matha & Deity) -->
  <g transform="translate(32, 42)">
    <!-- Folded Hands Shape -->
    <path d="M 0 -14 C 4 -6 9 3 9 14 H -9 C -9 3 -4 -6 0 -14 Z" fill="#ea580c" fill-opacity="0.22" stroke-width="4"/>
    <!-- Center Line of Joined Palms -->
    <line x1="0" y1="-14" x2="0" y2="14" stroke-width="3"/>
  </g>
</svg>
