<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Learn Vedic Wisdom &amp; Grantha">
  <defs>
    <radialGradient id="lea_sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FEF08A" />
      <stop offset="65%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </radialGradient>
    <linearGradient id="lea_gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="80%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="lea_saffron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="45%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>
    <linearGradient id="lea_page" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="50%" stop-color="#FFF3D6" />
      <stop offset="100%" stop-color="#FED7AA" />
    </linearGradient>
    <linearGradient id="lea_feather" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00695C" />
      <stop offset="60%" stop-color="#00897B" />
      <stop offset="100%" stop-color="#26A69A" />
    </linearGradient>
  </defs>

  <!-- Radiant Golden Sun of Wisdom (Jnana Surya) Rising Behind the Grantha -->
  <!-- Radiating Sun Rays of Knowledge -->
  <g stroke="url(#lea_gold)" stroke-width="2" stroke-linecap="round">
    <line x1="32" y1="4" x2="32" y2="10" />
    <line x1="19" y1="9" x2="22.5" y2="14" />
    <line x1="45" y1="9" x2="41.5" y2="14" />
    <line x1="9" y1="21" x2="15" y2="23" />
    <line x1="55" y1="21" x2="49" y2="23" />
    <line x1="4" y1="36" x2="10" y2="35" />
    <line x1="60" y1="36" x2="54" y2="35" />
  </g>

  <!-- Golden Sun Core Disc Rising -->
  <circle cx="32" cy="24" r="14" fill="url(#lea_sunGlow)" stroke="#F59E0B" stroke-width="1.2" />
  <!-- Sacred Gayatri / Surya Radiance Center -->
  <circle cx="32" cy="24" r="7" fill="#FFFFFF" opacity="0.9" />

  <!-- Open Sacred Grantha / Vedic Scripture Canvas -->
  <!-- Left Page -->
  <path d="M 32 30 Q 18 24 5 28 L 7 54 Q 19 50 32 55 Z" fill="url(#lea_page)" stroke="url(#lea_saffron)" stroke-width="1.6" stroke-linejoin="round" />
  <!-- Right Page -->
  <path d="M 32 30 Q 46 24 59 28 L 57 54 Q 45 50 32 55 Z" fill="url(#lea_page)" stroke="url(#lea_saffron)" stroke-width="1.6" stroke-linejoin="round" />

  <!-- Grantha Wooden Base Layer (Patali) -->
  <path d="M 5 54 Q 18 50 32 55 Q 46 50 59 54 L 58 59 Q 45 55 32 60 Q 19 55 6 59 Z" fill="#78350F" stroke="#B45309" stroke-width="0.8" />

  <!-- Central Spine Groove / Sacred Sutra Ribbon -->
  <line x1="32" y1="30" x2="32" y2="60" stroke="#B71C1C" stroke-width="2.2" stroke-linecap="round" />

  <!-- Inscribed Shloka Script Lines on Left Page -->
  <line x1="12" y1="35" x2="26" y2="33.5" stroke="#78350F" stroke-width="1.3" stroke-linecap="round" />
  <line x1="11" y1="40" x2="27" y2="38.5" stroke="#78350F" stroke-width="1.3" stroke-linecap="round" />
  <line x1="13" y1="45" x2="25" y2="43.5" stroke="#78350F" stroke-width="1.3" stroke-linecap="round" />

  <!-- Inscribed Shloka Script Lines on Right Page -->
  <line x1="38" y1="33.5" x2="52" y2="35" stroke="#78350F" stroke-width="1.3" stroke-linecap="round" />
  <line x1="37" y1="38.5" x2="53" y2="40" stroke="#78350F" stroke-width="1.3" stroke-linecap="round" />
  <line x1="39" y1="43.5" x2="51" y2="45" stroke="#78350F" stroke-width="1.3" stroke-linecap="round" />

  <!-- Saraswati Peacock Feather Quill Leaning Across the Open Grantha -->
  <g transform="translate(47, 30) rotate(26)">
    <!-- Feather Plume -->
    <path d="M 0 0 C -4.5 -2 -5 -8 0 -13 C 5 -8 4.5 -2 0 0 Z" fill="url(#lea_feather)" />
    <!-- Feather Eye -->
    <path d="M 0 -2.5 C -2.5 -4 -3 -7 0 -9.5 C 3 -7 2.5 -4 0 -2.5 Z" fill="#FBC02D" />
    <circle cx="0" cy="-6" r="1.5" fill="#1A237E" />
    <!-- Golden Quill Shaft -->
    <line x1="0" y1="0" x2="0" y2="24" stroke="url(#lea_gold)" stroke-width="1.4" stroke-linecap="round" />
    <polygon points="-1,24 1,24 0,28" fill="#D97706" />
  </g>

  <!-- Auspicious Sacred Lotus Seal in Center Base -->
  <circle cx="32" cy="55" r="3.2" fill="#B71C1C" stroke="#FEF08A" stroke-width="0.7" />
  <circle cx="32" cy="55" r="1.4" fill="#FDE047" />
</svg>