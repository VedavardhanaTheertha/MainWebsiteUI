<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Panchanga Vedic Astrological Calendar">
  <defs>
    <radialGradient id="pan_sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>
    <linearGradient id="pan_disc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451A03" />
      <stop offset="50%" stop-color="#1C0A00" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
    <linearGradient id="pan_gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="80%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="pan_moon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E0E7FF" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
  </defs>

  <!-- Outer Celestial Astrological Disc (Kala Chakra) -->
  <circle cx="32" cy="32" r="29" fill="url(#pan_disc)" stroke="url(#pan_gold)" stroke-width="2" />
  <circle cx="32" cy="32" r="26" fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="2 3.8" />

  <!-- 12 Zodiac / Rashi Division Dots Around Circumference -->
  <circle cx="32" cy="5" r="1.3" fill="#FEF08A" />
  <circle cx="45.5" cy="8.6" r="1.3" fill="#FEF08A" />
  <circle cx="55.4" cy="18.5" r="1.3" fill="#FEF08A" />
  <circle cx="59" cy="32" r="1.3" fill="#FEF08A" />
  <circle cx="55.4" cy="45.5" r="1.3" fill="#FEF08A" />
  <circle cx="45.5" cy="55.4" r="1.3" fill="#FEF08A" />
  <circle cx="32" cy="59" r="1.3" fill="#FEF08A" />
  <circle cx="18.5" cy="55.4" r="1.3" fill="#FEF08A" />
  <circle cx="8.6" cy="45.5" r="1.3" fill="#FEF08A" />
  <circle cx="5" cy="32" r="1.3" fill="#FEF08A" />
  <circle cx="8.6" cy="18.5" r="1.3" fill="#FEF08A" />
  <circle cx="18.5" cy="8.6" r="1.3" fill="#FEF08A" />

  <!-- Inner Concentric Dial Ring -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#pan_gold)" stroke-width="1.2" />

  <!-- Radiant Golden Surya (Sun - Pingala / Solar Day Tithi) on Left/Upper Half -->
  <!-- Surya Flame Rays -->
  <g transform="translate(32, 32)">
    <path d="M 0 -19 L 2 -14 L -2 -14 Z" fill="#F59E0B" />
    <path d="M -13 -13 L -10 -9 L -14 -7 Z" fill="#F59E0B" />
    <path d="M -19 0 L -14 2 L -14 -2 Z" fill="#F59E0B" />
    <path d="M -13 13 L -14 7 L -10 9 Z" fill="#F59E0B" />
    <path d="M 0 19 L -2 14 L 2 14 Z" fill="#F59E0B" />
  </g>

  <!-- Surya Face Half (Radiant Golden Disc) -->
  <path d="M 32 16 A 16 16 0 0 0 32 48 Z" fill="url(#pan_sunGlow)" stroke="#B45309" stroke-width="0.8" />
  <!-- Surya Peaceful Devotional Eye & Tilaka -->
  <circle cx="26" cy="27" r="1.5" fill="#78350F" />
  <path d="M 23 24 C 25 23 27 23 29 24" fill="none" stroke="#78350F" stroke-width="0.9" stroke-linecap="round" />
  <!-- Sacred Red Urdhva Pundra Tilaka on Surya -->
  <path d="M 28 32 C 28 30 30 30 30 32 C 30 34 28 34 28 32 Z" fill="#B71C1C" />

  <!-- Pearl-Silver Chandra Crescent (Moon - Ida / Lunar Tithi) on Right Half -->
  <path d="M 32 16 C 39 18 43 24 43 32 C 43 40 39 46 32 48 C 37 44 40 38 40 32 C 40 26 37 20 32 16 Z" fill="url(#pan_moon)" stroke="#60A5FA" stroke-width="0.7" />

  <!-- Auspicious Star (Nakshatra Tara) Nestled with Moon -->
  <polygon points="38,23 39.2,25.5 42,26 40,28 40.5,30.5 38,29 35.5,30.5 36,28 34,26 36.8,25.5" fill="#FEF08A" stroke="#D97706" stroke-width="0.4" />

  <!-- Center Golden Bindu / Navel of Time -->
  <circle cx="32" cy="32" r="2.5" fill="url(#pan_gold)" stroke="#78350F" stroke-width="0.6" />
  <circle cx="32" cy="32" r="1" fill="#B71C1C" />
</svg>