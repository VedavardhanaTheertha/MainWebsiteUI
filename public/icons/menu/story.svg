<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Story Ancient Puranic Scroll">
  <defs>
    <linearGradient id="sto_parchment" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="50%" stop-color="#FFF3D6" />
      <stop offset="100%" stop-color="#FED7AA" />
    </linearGradient>
    <linearGradient id="sto_gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="sto_roller" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A7D0A" />
      <stop offset="35%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="sto_feather" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00695C" />
      <stop offset="60%" stop-color="#00897B" />
      <stop offset="100%" stop-color="#26A69A" />
    </linearGradient>
  </defs>

  <!-- Top Wooden Roller Rod (Scroll Upper Spindle) -->
  <rect x="7" y="10" width="50" height="4.5" rx="2.2" fill="url(#sto_roller)" stroke="#78350F" stroke-width="0.7" />
  <!-- Left & Right Turned Wooden Finials -->
  <circle cx="6" cy="12.2" r="3.2" fill="url(#sto_gold)" stroke="#78350F" stroke-width="0.6" />
  <circle cx="58" cy="12.2" r="3.2" fill="url(#sto_gold)" stroke="#78350F" stroke-width="0.6" />

  <!-- Unfurling Parchment Scroll Canvas -->
  <path d="M 12 14.5 Q 32 18 52 14.5 L 50 49 Q 32 46 14 51 Z" fill="url(#sto_parchment)" stroke="#B45309" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Rolled Scroll Bottom Curl (Papyrus Roll Effect) -->
  <path d="M 14 51 Q 32 46 50 49 C 52 53 48 57 44 57 Q 32 53 12 56 C 8 56 10 51 14 51 Z" fill="#FDE68A" stroke="#78350F" stroke-width="1" />
  <ellipse cx="48" cy="53" rx="3.5" ry="3" fill="#D97706" />

  <!-- Traditional Red/Vermilion Ornate Border Bands -->
  <path d="M 15 19 Q 32 21.5 49 19" fill="none" stroke="#B71C1C" stroke-width="1" stroke-dasharray="2 2" />
  <path d="M 16 46 Q 32 43 48 45" fill="none" stroke="#B71C1C" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Inscribed Puranic Narrative Story Lines (Itihasa Script) -->
  <line x1="18" y1="24" x2="46" y2="24" stroke="#78350F" stroke-width="1.4" stroke-linecap="round" />
  <line x1="18" y1="29" x2="44" y2="29" stroke="#78350F" stroke-width="1.4" stroke-linecap="round" />
  <line x1="18" y1="34" x2="41" y2="34" stroke="#78350F" stroke-width="1.4" stroke-linecap="round" />
  <line x1="18" y1="39" x2="36" y2="39" stroke="#78350F" stroke-width="1.4" stroke-linecap="round" />

  <!-- Royal Red Wax / Lotus Seal on Scroll -->
  <circle cx="43" cy="38" r="4.8" fill="#B71C1C" stroke="#7F1D1D" stroke-width="0.7" />
  <circle cx="43" cy="38" r="3.2" fill="#DC2626" />
  <polygon points="43,35 44,37.5 46.5,38 44,38.5 43,41 42,38.5 39.5,38 42,37.5" fill="#FEF08A" />

  <!-- Elegant Peacock Feather Writing Quill Placed Diagonally -->
  <g transform="translate(45, 23) rotate(34)">
    <path d="M 0 0 C -5 -2 -6 -10 0 -15 C 6 -10 5 -2 0 0 Z" fill="url(#sto_feather)" />
    <!-- Feather Eye -->
    <path d="M 0 -3 C -3 -4.5 -3.5 -8 0 -11 C 3.5 -8 3 -4.5 0 -3 Z" fill="#FBC02D" />
    <circle cx="0" cy="-7" r="1.8" fill="#1A237E" />
    <!-- Golden Quill Shaft & Nib -->
    <line x1="0" y1="0" x2="0" y2="18" stroke="#9A7D0A" stroke-width="1.2" stroke-linecap="round" />
    <polygon points="-1,18 1,18 0,22" fill="#D97706" />
  </g>
</svg>