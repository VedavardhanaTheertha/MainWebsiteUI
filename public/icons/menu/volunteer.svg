<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Volunteer Sevakas in Service">
  <defs>
    <radialGradient id="vol_aura" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#FED7AA" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFBEB" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="vol_gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="80%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="vol_saffron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>
    <linearGradient id="vol_skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF1E6" />
      <stop offset="60%" stop-color="#FDBA74" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <!-- Radiant Golden Halo of Service Behind Devotees -->
  <circle cx="32" cy="24" r="22" fill="url(#vol_aura)" />

  <!-- Background Sevaka (Left - Supporting Devotee) -->
  <g opacity="0.95">
    <!-- Head -->
    <circle cx="21" cy="19" r="6" fill="url(#vol_skin)" stroke="#9A3412" stroke-width="0.7" />
    <!-- Sacred Tilaka on Forehead -->
    <line x1="21" y1="16.5" x2="21" y2="19.5" stroke="#B71C1C" stroke-width="1.2" stroke-linecap="round" />
    <!-- Shoulders & Saffron Robes -->
    <path d="M 10 39 C 10 30 14 26 21 26 C 24 26 27 28 29 30 L 25 39 Z" fill="url(#vol_saffron)" stroke="#78350F" stroke-width="0.7" />
  </g>

  <!-- Background Sevaka (Right - Supporting Devotee) -->
  <g opacity="0.95">
    <!-- Head -->
    <circle cx="43" cy="19" r="6" fill="url(#vol_skin)" stroke="#9A3412" stroke-width="0.7" />
    <!-- Sacred Tilaka on Forehead -->
    <line x1="43" y1="16.5" x2="43" y2="19.5" stroke="#B71C1C" stroke-width="1.2" stroke-linecap="round" />
    <!-- Shoulders & Saffron Robes -->
    <path d="M 54 39 C 54 30 50 26 43 26 C 40 26 37 28 35 30 L 39 39 Z" fill="url(#vol_saffron)" stroke="#78350F" stroke-width="0.7" />
  </g>

  <!-- Lead Central Sevaka (Devotee with Hands in Namaskara) -->
  <g>
    <!-- Head -->
    <circle cx="32" cy="15" r="7.5" fill="url(#vol_skin)" stroke="#9A3412" stroke-width="0.8" />
    <!-- Traditional Urdhva Pundra Tilaka -->
    <path d="M 32 11.5 L 32 16" stroke="#B71C1C" stroke-width="1.4" stroke-linecap="round" />
    <circle cx="32" cy="16.5" r="0.7" fill="#FDE047" />

    <!-- Upper Body & Saffron Uttariya (Sacred Shawl) -->
    <path d="M 18 43 C 18 31 23 25 32 25 C 41 25 46 31 46 43 L 42 59 L 22 59 Z" fill="url(#vol_saffron)" stroke="#78350F" stroke-width="0.9" />

    <!-- Sacred Golden Angavastram Trim -->
    <path d="M 23 27 C 27 34 27 48 24 59" stroke="url(#vol_gold)" stroke-width="1.6" stroke-linecap="round" />
    <path d="M 41 27 C 37 34 37 48 40 59" stroke="url(#vol_gold)" stroke-width="1.6" stroke-linecap="round" />

    <!-- Two Hands in Respectful Namaskara Mudra (Folded Anjali) -->
    <path d="M 32 30 C 30 33 29 38 32 44 C 35 38 34 33 32 30 Z" fill="#FFF1E6" stroke="#9A3412" stroke-width="0.9" stroke-linejoin="round" />
    <!-- Finger Definition Lines -->
    <line x1="32" y1="31" x2="32" y2="43" stroke="#EA580C" stroke-width="0.7" />
  </g>

  <!-- Auspicious Golden Heart of Seva Radiating at Chest Center -->
  <path d="M 32 46 C 32 46 25 41 25 36.5 C 25 33.5 27.5 32 29.5 32 C 31 32 32 33.5 32 33.5 C 32 33.5 33 32 34.5 32 C 36.5 32 39 33.5 39 36.5 C 39 41 32 46 32 46 Z" fill="url(#vol_gold)" stroke="#B71C1C" stroke-width="0.8" />
  <circle cx="32" cy="38" r="1.5" fill="#B71C1C" />

  <!-- Base Garland / Decorative Lotus Base -->
  <path d="M 12 59 Q 32 55 52 59" stroke="url(#vol_gold)" stroke-width="2" stroke-linecap="round" />
  <circle cx="22" cy="58" r="1.8" fill="#F59E0B" />
  <circle cx="32" cy="57" r="2.2" fill="#B71C1C" />
  <circle cx="42" cy="58" r="1.8" fill="#F59E0B" />
</svg>