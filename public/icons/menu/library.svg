<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" stroke="#ea580c" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Library">
  <!-- Shelf Base Line -->
  <line x1="6" y1="56" x2="58" y2="56" stroke-width="5"/>

  <!-- Book 1 (Tall Left Volume with Bookmark) -->
  <rect x="10" y="12" width="11" height="44" rx="2.5" fill="#ea580c" fill-opacity="0.1"/>
  <line x1="10" y1="20" x2="21" y2="20" stroke-width="3.5"/>
  <line x1="10" y1="46" x2="21" y2="46" stroke-width="3.5"/>
  <!-- Bookmark Ribbon -->
  <path d="M 15.5 12 V 24 L 18 21.5 L 20.5 24 V 12" fill="#ea580c" stroke-width="1"/>

  <!-- Book 2 (Middle Volume) -->
  <rect x="24" y="19" width="11" height="37" rx="2.5" fill="#ea580c" fill-opacity="0.1"/>
  <line x1="24" y1="27" x2="35" y2="27" stroke-width="3.5"/>
  <circle cx="29.5" cy="38" r="2" fill="#ea580c" stroke="none"/>

  <!-- Book 3 (Tilted Right Volume) -->
  <g transform="translate(37, 56) rotate(16)">
    <rect x="0" y="-39" width="11" height="39" rx="2.5" fill="#ea580c" fill-opacity="0.1"/>
    <line x1="0" y1="-31" x2="11" y2="-31" stroke-width="3.5"/>
    <line x1="0" y1="-10" x2="11" y2="-10" stroke-width="3.5"/>
  </g>
</svg>