<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" stroke="#ea580c" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Krishna Mantra Lekhana Yajna">
  <!-- Peacock Feather (Mayura Pinchha) tucked above the flute, slanted at 22deg -->
  <g transform="translate(36, 22) rotate(22)">
    <!-- Natural Teardrop Plume Body -->
    <path d="M 0 0 C -8.5 -3 -10 -14 0 -22 C 10 -14 8.5 -3 0 0 Z" fill="#ea580c" fill-opacity="0.18" stroke-width="3.5"/>
    <!-- Side Barb Notches -->
    <path d="M -6.5 -6.5 L -3 -5.5 M 6.5 -6.5 L 3 -5.5 M -7 -12 L -3.5 -11 M 7 -12 L 3.5 -11" stroke-width="2"/>
    <!-- Central Rachis / Stem -->
    <line x1="0" y1="0" x2="0" y2="-16.5" stroke-width="2.5"/>
    <!-- Outer Eye Ring -->
    <path d="M 0 -3.5 C -5 -5 -5.5 -11 0 -16 C 5.5 -11 5 -5 0 -3.5 Z" fill="#ea580c" fill-opacity="0.3" stroke-width="2"/>
    <!-- Deep Inner Eye -->
    <circle cx="0" cy="-9.5" r="2.2" fill="#ea580c" stroke="none"/>
  </g>

  <!-- Golden Krishna Flute (Murali) resting above the book -->
  <g transform="translate(32, 23) rotate(-6)">
    <!-- Flute body -->
    <line x1="-26" y1="0" x2="26" y2="0" stroke-width="4.5"/>
    <!-- Tone holes -->
    <circle cx="-5" cy="0" r="1.3" fill="#ea580c" stroke="none"/>
    <circle cx="1" cy="0" r="1.3" fill="#ea580c" stroke="none"/>
    <circle cx="7" cy="0" r="1.3" fill="#ea580c" stroke="none"/>
    <circle cx="13" cy="0" r="1.3" fill="#ea580c" stroke="none"/>
  </g>

  <!-- Large Open Book / Grantha -->
  <path d="M 5 33 Q 18.5 28 32 34 Q 45.5 28 59 33 L 56 57 Q 44 52 32 58 Q 20 52 8 57 Z" fill="#ea580c" fill-opacity="0.08" stroke-width="4.2"/>
  <line x1="32" y1="34" x2="32" y2="58" stroke-width="3"/>

  <!-- Left Page: Mantra Inscriptions -->
  <line x1="12" y1="43" x2="24" y2="41.5" stroke-width="3"/>
  <line x1="12" y1="49" x2="24" y2="47.5" stroke-width="3"/>

  <!-- Hand Holding Pen writing on the right page -->
  <!-- Hand Wrist / Forearm entering from right -->
  <path d="M 57 40 L 49 43 C 46 44 45 47 46 49 C 47.5 51 50 51.5 52 50.5 L 57 47" fill="#ea580c" fill-opacity="0.15" stroke-width="3.8"/>

  <!-- Pen Barrel & Nib -->
  <line x1="48" y1="34" x2="41" y2="46" stroke-width="4.5"/>
  <polygon points="41,46 44,45 37,53" fill="#ea580c" stroke-width="1.5"/>

  <!-- Freshly Inscribed Mantra Wave -->
  <path d="M 39 53 C 42 55 46 53 49 54" stroke-width="3"/>
</svg>
