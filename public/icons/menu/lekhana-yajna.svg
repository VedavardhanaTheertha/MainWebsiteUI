<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Krishna Mantra Lekhana Yajna">
  <defs>
    <linearGradient id="lek_saffron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF6C00" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>
    <linearGradient id="lek_pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF3D6" />
    </linearGradient>
    <linearGradient id="lek_featherBody" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00695C" />
      <stop offset="65%" stop-color="#00897B" />
      <stop offset="100%" stop-color="#26A69A" />
    </linearGradient>
    <linearGradient id="lek_fluteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBC02D" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A7D0A" />
    </linearGradient>
    <linearGradient id="lek_penBarrel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#283593" />
      <stop offset="100%" stop-color="#1A237E" />
    </linearGradient>
  </defs>

  <!-- Peacock Feather (Mayura Pinchha) Tucked Above the Flute -->
  <g transform="translate(36, 22) rotate(22)">
    <!-- Natural Teardrop Plume -->
    <path d="M 0 0 C -8.5 -3 -10 -14 0 -22 C 10 -14 8.5 -3 0 0 Z" fill="url(#lek_featherBody)" />
    <!-- Side Barb Notches -->
    <path d="M -6.5 -6.5 L -3 -5.5 M 6.5 -6.5 L 3 -5.5 M -7 -12 L -3.5 -11 M 7 -12 L 3.5 -11" stroke="#FFF8E7" stroke-width="0.9" stroke-linecap="round" opacity="0.85" />
    <!-- Central Rachis -->
    <line x1="0" y1="0" x2="0" y2="-16.5" stroke="#A5D6A7" stroke-width="0.9" stroke-linecap="round" />
    <!-- Golden Outer Eye -->
    <path d="M 0 -3.5 C -5 -5 -5.5 -11 0 -16 C 5.5 -11 5 -5 0 -3.5 Z" fill="#FBC02D" />
    <!-- Deep Krishna Blue Inner Eye -->
    <path d="M 0 -5.5 C -3 -6.5 -3.2 -10 0 -13 C 3.2 -10 3 -6.5 0 -5.5 Z" fill="#1A237E" />
  </g>

  <!-- Golden Krishna Flute (Murali) Resting Above the Open Book -->
  <g transform="translate(32, 22.5) rotate(-6)">
    <!-- Flute Body -->
    <rect x="-28" y="-2.4" width="56" height="4.8" rx="2.4" fill="url(#lek_fluteGrad)" stroke="#7E5109" stroke-width="0.7" />
    <!-- Decorative Red Binding Rings -->
    <rect x="-22.5" y="-2.6" width="2.2" height="5.2" fill="#B71C1C" />
    <rect x="-12" y="-2.6" width="1.8" height="5.2" fill="#B71C1C" />
    <rect x="21" y="-2.6" width="2.2" height="5.2" fill="#B71C1C" />
    <!-- Blow Hole & Finger Holes -->
    <circle cx="-17" cy="0" r="1.1" fill="#3E2723" />
    <circle cx="-4.5" cy="0" r="1" fill="#3E2723" />
    <circle cx="1.5" cy="0" r="1" fill="#3E2723" />
    <circle cx="7.5" cy="0" r="1" fill="#3E2723" />
    <circle cx="13.5" cy="0" r="1" fill="#3E2723" />
    <circle cx="18" cy="0" r="0.9" fill="#3E2723" />
  </g>

  <!-- Large Open Book / Grantha -->
  <path d="M 3 32 Q 17.5 27 32 33 Q 46.5 27 61 32 L 57.5 58 Q 44.5 53 32 59 Q 19.5 53 6.5 58 Z" fill="url(#lek_pageGrad)" stroke="url(#lek_saffron)" stroke-width="2.6" stroke-linejoin="round" />
  <!-- Center Crease -->
  <line x1="32" y1="33" x2="32" y2="59" stroke="#D7B180" stroke-width="1.5" />

  <!-- Sanskrit "श्री" on Left Page -->
  <text x="17" y="48" text-anchor="middle" font-family="'Noto Sans Devanagari', 'Kohinoor Devanagari', 'Mangal', sans-serif" font-weight="800" font-size="16.5" fill="#B71C1C">श्री</text>

  <!-- Sanskrit "कृष्ण" on Right Page -->
  <text x="47" y="46.5" text-anchor="middle" font-family="'Noto Sans Devanagari', 'Kohinoor Devanagari', 'Mangal', sans-serif" font-weight="800" font-size="11.5" fill="#B71C1C">कृष्ण</text>

  <!-- Sleek Krishna Indigo Pen Along Center Spine -->
  <g transform="translate(30.5, 49.5) rotate(14)">
    <rect x="-2.1" y="-17" width="4.2" height="16.5" rx="1.2" fill="url(#lek_penBarrel)" />
    <rect x="-2.1" y="-17.5" width="4.2" height="2" rx="0.8" fill="#FBC02D" />
    <rect x="-2.3" y="-3.8" width="4.6" height="1.8" rx="0.4" fill="#FBC02D" />
    <polygon points="-2.1,0 2.1,0 0,5.2" fill="#E65100" />
  </g>
</svg>