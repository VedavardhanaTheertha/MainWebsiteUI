# Build check for the canonical branch.
#
# Deliberately does NOT deploy. `deploy-dev.yml` publishes the permanent GitHub
# Pages placeholder preview from reviewed `main`; pull-request branches are verified
# here but do not replace that shared preview. The `prod` configuration targets a
# future Cloudflare Pages deployment, which is planned but not connected.
#
# So main's job here is to prove the committed tree still builds. Both
# environments are built, because they differ in more than a flag: prod renders
# real content and is indexable, so a fault can exist in one and not the other.
#
# All build logic lives in build/build.mjs and can be run locally:
#     node build/build.mjs dev
#     node build/build.mjs prod
# See docs/DEVELOPER.md (Validation) and docs/ARCHITECTURE.md (Build and deployment).
name: Verify build

on:
  push:
    branches: [main, dev]

  # Run on PRs into main or dev, so a change is checked before it merges
  # rather than after. docs/GUIDELINE_SOURCE_CODE.md §7 expects review to
  # happen before merge; this gives the reviewer a build result to look at.
  pull_request:
    branches: [main, dev]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ensure PR to main comes only from dev
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::Pull requests targeting 'main' are only allowed from the 'dev' branch. Head ref was '${{ github.head_ref }}'."
            exit 1
          fi

      # The Bhakti generator reads the library submodule, so every checkout must
      # initialize nested content recursively.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate content, lint, typecheck, and unit tests
        run: npm run check

      - name: Build and verify (dev)
        run: npm run build:dev

      - name: Build and verify (prod)
        run: npm run build:prod
