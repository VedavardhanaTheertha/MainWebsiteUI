name: Auto-Sync Submodule Pointers

on:
  repository_dispatch:
    types: [submodule-updated]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          persist-credentials: true
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Update submodules to latest remote HEAD
        run: |
          git submodule update --init --recursive --remote
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add library settings
          if git diff --staged --quiet; then
            echo "Submodules already up to date."
          else
            git commit -m "chore(submodules): auto-update settings and library pointers"
            git push origin main
          fi
