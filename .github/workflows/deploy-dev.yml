# Builds and publishes the development site to GitHub Pages.
#
# Deliberately thin: all build logic lives in build/build.mjs so it can be run
# and debugged locally. See docs/DEVELOPER.md §6 and docs/ARCHITECTURE.md §7.
name: Deploy dev site

on:
  # The permanent preview represents the latest reviewed main revision.
  push:
    branches: [main]

  # GitHub runs schedules from the default branch, so this rebuild publishes main.
  # It is currently a daily build canary; it will also refresh date-sensitive static
  # output once the scheduler is connected to rendered content.
  schedule:
    - cron: "0 21 * * *"

  # Allows a build to be triggered by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys race; let a newer commit supersede an in-flight run.
concurrency:
  group: pages-dev
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_ENV: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          submodules: recursive
          persist-credentials: false
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build and verify
        run: npm run build:dev

      # Deliberately no actions/configure-pages step here. It fails when Pages is
      # not yet enabled on the repository, which would make the whole build job
      # look broken when the code is fine. Its only real job is exporting a base
      # path for frameworks that auto-detect one, and we set ours explicitly in
      # next.config.ts from config/site.yml. Keeping it out means the build
      # succeeds and uploads its artifact regardless of Pages configuration, and
      # only the deploy job below fails if Pages is not set up.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
