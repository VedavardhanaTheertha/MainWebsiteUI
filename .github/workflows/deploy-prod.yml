# Builds and verifies the production site for Cloudflare Pages.
# Production publishing is handled automatically by Cloudflare Pages' native Git integration.
#
# Deliberately thin: all build logic lives in build/build.mjs so it can be run
# and debugged locally. See docs/ARCHITECTURE.md (Build and deployment).
name: Deploy production site

on:
  # Deploy production automatically on push to main (e.g. when PR from dev merges).
  push:
    branches: [main]

  # Daily builds refresh date-sensitive upcoming/past event partitions and seeded carousels.
  schedule:
    - cron: "0 21 * * *"

  # Production does NOT rebuild on raw submodule updates; it updates only via PR from dev.
  # Manual promotion dispatch is preserved.
  repository_dispatch:
    types: [promote-prod]

  # Allows a production build to be triggered manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-prod
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_ENV: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          submodules: recursive
          persist-credentials: true
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Pull latest submodule revisions
        run: git submodule update --init --recursive --remote

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Generate content, lint, typecheck, and unit tests
        run: npm run check

      - name: Cache Next.js build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-prod-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-prod-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextjs-prod-

      - name: Build production site
        env:
          SKIP_NEXT_TYPECHECK: "1"
          PRESERVE_NEXT_CACHE: "1"
        run: npm run build:prod

