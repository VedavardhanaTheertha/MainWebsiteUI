about:
  mission:
    heading: "Our Mission"
    body: "Shri Shiroor Matha exists to preserve and share the Madhwa tradition of Vedantic scholarship, devotion, and service — through daily worship, the education of students in the shastras, care for the community through seva and annadana, and faithful participation in the Paryaya system established by Shri Madhwacharyaru."

  chiefSwamiji:
    heading: "Current Spiritual Master"
    name: "Sri Vedavardhana Teertharu"
    title: "Chief Swamiji, Shri Shiroor Matha"
    description: "Sri Vedavardhana Teertharu presently guides Shri Shiroor Matha, carrying forward the unbroken lineage of teachers descending from Shriman Madhwacharyaru. Under his guidance, the matha continues its tradition of scholarship, worship, and service to the community."
    portrait: "chief-swamiji"

  paryayaSignificance:
    heading: "Significance of Paryāya"
    body: "Paryāya is the two-year cycle in which each of the eight mathas of Udupi takes turn presiding over the worship of Shri Krishna at the Udupi Krishna Matha, a tradition established by Shri Madhwacharyaru himself. Shri Shiroor Matha is one of these eight ashta mathas."

  udupi:
    heading: "Kāshi of the South"
    body: "Udupi is revered as the Kāshi of the South, home to the ancient Chandramaulīshvara and Anantheshvara temples alongside the Krishna Matha. It has been a center of Vedantic learning and pilgrimage for centuries."

  guruparampara:
    heading: "Guru Paramparā"
    intro: "The sacred lineage of spiritual masters who have guided Shri Shiroor Matha through centuries of divine service and wisdom."
    entries:
      - order: 1
        name: "Sri Madhwacharyaru"
        title: "Founder of the Madhwa Tradition"
        description: "The Divine Incarnation who established the path of pure devotion (Tatvavada) through his commentaries on the Brahma Sutras, Upanishads, Bhagavad Gita, and other sacred texts."
        portrait: "guru-01"
      - order: 2
        name: "Sri Vamana Teertharu"
        title: "Second in the Lineage"
        description: "A direct disciple who carried forward the founder's teachings and established the early traditions of the matha."
        portrait: "guru-02"
      - order: 3
        name: "Sri Vasudeva Teertharu"
        title: "Third in the Lineage"
        description: "Continued the tradition of scholarship and worship established by his predecessors."
        portrait: "guru-03"
      - order: 31
        name: "Sri Vedavardhana Teertharu"
        title: "Current Spiritual Master"
        description: "Presently guides Shri Shiroor Matha, continuing the unbroken lineage of teachers descending from Shriman Madhwacharyaru."
        portrait: "chief-swamiji"

