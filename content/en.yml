history:
  pages:
    - key: stories
      title: "Sadhana Stories"
      image: "history-stories"
      intro: "Chronicles of devotion and perseverance from within the matha community."
      entries:
        - id: goshala-founding
          title: "Founding the Go-shāla"
          body: "Decades ago, a small group of devotees began caring for a handful of cows on land donated to the matha. Today the go-shāla shelters dozens, sustained entirely by seva contributions."
        - id: annadana-tradition
          title: "An Unbroken Annadana Tradition"
          body: "The Bhojana Shaala has served meals to devotees and pilgrims without interruption for generations, a tradition the matha considers central to its mission."
    - key: articles
      title: "Blogs & Articles"
      image: "history-articles"
      intro: "News, reflections, and updates from the matha."
      entries:
        - id: solar-power
          title: "Solar Power Installed at the Matha"
          body: "A new rooftop solar array now powers the annadana hall and guest quarters, cutting the matha's energy costs and supporting its long-term sustainability goals."
        - id: paryaya-preparations
          title: "Preparing for the Next Paryaya"
          body: "As the current Paryaya term nears its midpoint, preparations are already underway for the ceremonies marking the transition to the next matha in the cycle."
    - key: symbolism
      title: "Symbolism of Hindu Deities, Rituals & Sacred Icons"
      image: "history-symbolism"
      intro: "Understanding the meaning behind the icons and rituals of daily worship."
      entries:
        - id: shankha-chakra
          title: "The Shankha and Chakra"
          body: "The conch and discus carried by Vishnu represent sound and the cycle of time — two of his most recognizable attributes across Vaishnava iconography."
        - id: tulasi
          title: "The Tulasi Plant"
          body: "Tulasi is central to Vaishnava worship, offered daily in puja and regarded as inseparable from devotion to Vishnu."
    - key: remedies
      title: "Problem Solving Mantras, Rituals & Targeted Sevas"
      image: "history-remedies"
      intro: "Traditional remedies drawn from shastra for common life challenges — see also the Solutions page for a devotee-friendly overview."
      entries:
        - id: navagraha-shanti
          title: "Navagraha Shanti"
          body: "A ritual performed to pacify adverse planetary influence, typically recommended after consultation with a family priest or astrologer."
        - id: sudarshana-homa
          title: "Sudarshana Homa"
          body: "A fire ritual invoking Vishnu's protective aspect, performed for the removal of obstacles."
    - key: science
      title: "Hindu Science & Vedic Philosophy Research"
      image: "history-science"
      intro: "Exploring the intersections of traditional knowledge systems and contemporary inquiry."
      entries:
        - id: tatvavada-logic
          title: "The Logical Structure of Tatvavada"
          body: "Shri Madhwacharyaru's philosophy is distinguished by its systematic use of logical argument (nyaya) alongside scriptural authority."
        - id: panchanga-astronomy
          title: "Panchanga and Astronomical Calculation"
          body: "The traditional almanac draws on centuries-old astronomical calculation methods, still maintained and cross-checked today."
    - key: pilgrim-guide
      title: "Pilgrim Guide"
      image: "history-pilgrim-guide"
      intro: "Practical information for devotees planning a visit to Shri Shiroor Matha and Udupi."
      entries:
        - id: getting-here
          title: "Getting Here"
          body: "Udupi is well connected by rail and road; the matha is a short walk from the Krishna Matha on Car Street."
        - id: where-to-stay
          title: "Where to Stay"
          body: "Guest accommodation is available on the matha premises for pilgrims; advance booking through the matha office is recommended during festival periods."

