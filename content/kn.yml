userStories:
  heading: "ನಿಮ್ಮ ಕಥೆಯನ್ನು ಜಗತ್ತಿಗೆ ತಿಳಿಸಿ"
  intro: "ಹೃದಯದಿಂದ ಹಂಚಿಕೊಂಡ ಭಕ್ತರ ಅನುಭವಗಳು — ಪ್ರಕಟಿಸುವ ಮೊದಲು ಸಲ್ಲಿಕೆಗಳನ್ನು ಪರಿಶೀಲಿಸಲಾಗುತ್ತದೆ."
  stories:
    - id: story-1
      name: "ಮುಂಬೈನ ಒಬ್ಬ ಭಕ್ತ"
      story: "ನನ್ನ ಕುಟುಂಬವು ಪ್ರತಿ ವರ್ಷ ಪರ್ಯಾಯ ಆಚರಣೆಗಳಿಗೆ ಶಿರೂರು ಮಠಕ್ಕೆ ಭೇಟಿ ನೀಡುತ್ತದೆ — ಪೀಳಿಗೆಗಳಾದ್ಯಂತ ನಿರಂತರತೆಯ ಭಾವನೆಯನ್ನು ಪದಗಳಲ್ಲಿ ಸಂಪೂರ್ಣವಾಗಿ ಸೆರೆಹಿಡಿಯಲಾಗದು."
      image: "story-1"
    - id: story-2
      name: "ಬೆಂಗಳೂರಿನ ಒಬ್ಬ ಭಕ್ತ"
      story: "ನನ್ನ ತಂದೆಯ ಸ್ಮರಣಾರ್ಥ ನಾವು ಪ್ರಾಯೋಜಿಸಿದ ವೇದ ಪಾರಾಯಣ ಸೇವೆಯನ್ನು ಅಷ್ಟು ಕಾಳಜಿಯಿಂದ ನಡೆಸಲಾಯಿತು. ಇದು ನಮ್ಮ ಕುಟುಂಬಕ್ಕೆ ಬಹಳಷ್ಟು ಅರ್ಥವನ್ನು ನೀಡಿತು."
      image: "story-2"
  submitCtaLabel: "ನಿಮ್ಮ ಕಥೆಯನ್ನು ಹಂಚಿಕೊಳ್ಳಿ"
