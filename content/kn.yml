mantraYajna:
  heading: "ಕೃಷ್ಣ ಮಂತ್ರ ಲೇಖನ ಯಜ್ಞ"
  subheading: "ಸಂಕಲ್ಪ · ಶ್ರೀ ಕೃಷ್ಣಾಯ ನಮಃ"
  body: "ಭಕ್ತರು ಮಠದಲ್ಲಿ ಇರಿಸಲಾದ ವಿಶೇಷ ರಿಜಿಸ್ಟರ್‌ನಲ್ಲಿ \"ಶ್ರೀ ಕೃಷ್ಣಾಯ ನಮಃ\" ಎಂದು ಬರೆಯಲು ಆಹ್ವಾನಿಸಲಾಗಿದೆ, ಉಡುಪಿಯ ಶ್ರೀಕೃಷ್ಣನ ದಿವ್ಯ ಸಾನ್ನಿಧ್ಯದೊಂದಿಗೆ ಸಂಕಲ್ಪವನ್ನು ಜೋಡಿಸುತ್ತಾ. ಪೂರ್ಣಗೊಂಡ ರಿಜಿಸ್ಟರ್‌ಗಳನ್ನು ಪರ್ಯಾಯ ಆಚರಣೆಗಳ ಸಮಯದಲ್ಲಿ ಗರ್ಭಗುಡಿಯಲ್ಲಿ ಅರ್ಪಿಸಲಾಗುತ್ತದೆ."
  ctaLabel: "ಯಜ್ಞದಲ್ಲಿ ಸೇರಿ"
  image: "mantra-yajna-hero"

seva:
  heading: "ಸೇವೆ"
  intro: "ತನು, ಮನ, ಧನ — ನಿಮ್ಮ ಸಮಯ, ಭಕ್ತಿ ಅಥವಾ ಸಂಪನ್ಮೂಲಗಳನ್ನು ಮಠದ ಸೇವೆಗೆ ಅರ್ಪಿಸಿ."
  categories: ["Nitya", "Special"]
  items:
    - id: nitya-puja
      name: "ನಿತ್ಯ ಪೂಜೆ"
      category: "Nitya"
      description: "ಗರ್ಭಗುಡಿಯಲ್ಲಿ ನಡೆಯುವ ದೈನಂದಿನ ಪೂಜಾ ವಿಧಿಗಳನ್ನು ಪ್ರಾಯೋಜಿಸಿ."
      price: "₹501"
      image: "seva-nitya-puja"
      featured: true
    - id: annadana-seva
      name: "ಅನ್ನದಾನ ಸೇವೆ"
      category: "Nitya"
      description: "ಭೋಜನ ಶಾಲೆಯಲ್ಲಿ ಬಡಿಸುವ ಒಂದು ದಿನದ ಊಟಕ್ಕೆ ಕೊಡುಗೆ ನೀಡಿ."
      price: "₹1,101"
      image: "seva-annadana"
      featured: true
    - id: go-seva
      name: "ಗೋ ಸೇವೆ"
      category: "Nitya"
      description: "ಮಠದ ಗೋಶಾಲೆಯಲ್ಲಿ ಹಸುಗಳ ಆರೈಕೆ ಮತ್ತು ಆಹಾರಕ್ಕೆ ಬೆಂಬಲ ನೀಡಿ."
      price: "₹251"
      image: "seva-go"
      featured: true
    - id: veda-parayana
      name: "ವೇದ ಪಾರಾಯಣ ಸೇವೆ"
      category: "Special"
      description: "ನಿವಾಸಿ ವಿದ್ವಾಂಸರಿಂದ ವೇದಗಳ ನಿರಂತರ ಪಠಣವನ್ನು ಪ್ರಾಯೋಜಿಸಿ."
      price: "₹2,101"
      image: "seva-veda-parayana"
      featured: true
    - id: rathotsava-seva
      name: "ರಥೋತ್ಸವ ಸೇವೆ"
      category: "Special"
      description: "ವಾರ್ಷಿಕ ರಥೋತ್ಸವದ ಏರ್ಪಾಡುಗಳಿಗೆ ಕೊಡುಗೆ ನೀಡಿ."
      price: "₹5,001"
      image: "seva-rathotsava"
      featured: false
    - id: vastra-seva
      name: "ವಸ್ತ್ರ ಸೇವೆ"
      category: "Special"
      description: "ದೇವರ ದೈನಂದಿನ ಅಲಂಕಾರಕ್ಕಾಗಿ ಹೊಸ ವಸ್ತ್ರವನ್ನು ಅರ್ಪಿಸಿ."
      price: "₹751"
      image: "seva-vastra"
      featured: false

sevaVolunteer:
  heading: "ನಮ್ಮೊಂದಿಗೆ ಸ್ವಯಂಸೇವೆ"
  intro: "ಮಠದ ದೈನಂದಿನ ಚಟುವಟಿಕೆಗಳು ಮತ್ತು ಹಬ್ಬಗಳಿಗೆ ನಿಮ್ಮ ಸಮಯ ಮತ್ತು ಕೌಶಲ್ಯಗಳನ್ನು ಅರ್ಪಿಸಿ."
  steps:
    - "ನೀವು ಸಹಾಯ ಮಾಡಲು ಬಯಸುವ ಕ್ಷೇತ್ರವನ್ನು ಆಯ್ಕೆಮಾಡಿ — ಅಡುಗೆಮನೆ, ಕಾರ್ಯಕ್ರಮಗಳು, ಮಾಧ್ಯಮ ಅಥವಾ ಅತಿಥಿ ಸೇವೆಗಳು."
    - "ನಿಮ್ಮ ಲಭ್ಯತೆ ಮತ್ತು ಸಂಪರ್ಕ ವಿವರಗಳನ್ನು ಸೇವಾ ಡೆಸ್ಕ್‌ನೊಂದಿಗೆ ಹಂಚಿಕೊಳ್ಳಿ."
    - "ಮಠದ ಕಚೇರಿ ನಿಮ್ಮ ಭೇಟಿಗೆ ಮುಂಚಿತವಾಗಿ ನಿಮ್ಮ ವೇಳಾಪಟ್ಟಿಯನ್ನು ದೃಢಪಡಿಸುತ್ತದೆ."
  ctaLabel: "ಸ್ವಯಂಸೇವಕರಾಗಿ ನೋಂದಾಯಿಸಿ"

sevaDonations:
  heading: "ದೇಣಿಗೆಗಳು"
  intro: "ನಿಮ್ಮ ಕೊಡುಗೆ ಮಠದ ದೈನಂದಿನ ಪೂಜೆ, ಶಿಕ್ಷಣ ಮತ್ತು ಸಮುದಾಯ ಸೇವೆಯನ್ನು ಉಳಿಸಿಕೊಳ್ಳುತ್ತದೆ."
  upiId: "shiroor.matha@upi"
  presetAmounts: [101, 501, 1101, 2101]

panchanga:
  heading: "ಪಂಚಾಂಗ"
  intro: "ಇಂದಿನ ಪಂಚಾಂಗ — ತಿಥಿ, ನಕ್ಷತ್ರ ಮತ್ತು ಶುಭ ಸಮಯಗಳು."
  valid_for_date: "2026-07-27"
  tithi: "ಶುಕ್ಲ ಪಂಚಮಿ"
  nakshatra: "ಉತ್ತರ ಫಲ್ಗುಣಿ"
  sunrise: "06:12"
  sunset: "18:47"
  notes: "ಹೊಸ ಕಾರ್ಯಗಳನ್ನು ಪ್ರಾರಂಭಿಸಲು ಸೂಕ್ತವಾದ ದಿನ."

history:
  pages:
    - key: stories
      title: "ಸಾಧನಾ ಕಥೆಗಳು"
      image: "history-stories"
      intro: "ಮಠದ ಸಮುದಾಯದೊಳಗಿನ ಭಕ್ತಿ ಮತ್ತು ಪರಿಶ್ರಮದ ಚರಿತ್ರೆಗಳು."
      entries:
        - id: goshala-founding
          title: "ಗೋಶಾಲೆಯ ಸ್ಥಾಪನೆ"
          body: "ದಶಕಗಳ ಹಿಂದೆ, ಒಂದು ಸಣ್ಣ ಭಕ್ತರ ಗುಂಪು ಮಠಕ್ಕೆ ದಾನವಾಗಿ ನೀಡಿದ ಭೂಮಿಯಲ್ಲಿ ಕೆಲವು ಹಸುಗಳ ಆರೈಕೆಯನ್ನು ಪ್ರಾರಂಭಿಸಿತು. ಇಂದು ಗೋಶಾಲೆಯು ಸಂಪೂರ್ಣವಾಗಿ ಸೇವಾ ಕೊಡುಗೆಗಳಿಂದ ಪೋಷಿಸಲ್ಪಟ್ಟ ಡಜನ್‌ಗಟ್ಟಲೆ ಹಸುಗಳಿಗೆ ಆಶ್ರಯ ನೀಡುತ್ತದೆ."
        - id: annadana-tradition
          title: "ಅವಿಚ್ಛಿನ್ನ ಅನ್ನದಾನ ಪರಂಪರೆ"
          body: "ಭೋಜನ ಶಾಲೆಯು ಪೀಳಿಗೆಗಳಿಂದ ಅಡೆತಡೆಯಿಲ್ಲದೆ ಭಕ್ತರಿಗೆ ಮತ್ತು ಯಾತ್ರಿಕರಿಗೆ ಊಟವನ್ನು ಬಡಿಸಿದೆ, ಇದನ್ನು ಮಠವು ತನ್ನ ಧ್ಯೇಯದ ಕೇಂದ್ರವೆಂದು ಪರಿಗಣಿಸುತ್ತದೆ."
    - key: articles
      title: "ಬ್ಲಾಗ್ ಮತ್ತು ಲೇಖನಗಳು"
      image: "history-articles"
      intro: "ಮಠದಿಂದ ಸುದ್ದಿಗಳು, ಚಿಂತನೆಗಳು ಮತ್ತು ನವೀಕರಣಗಳು."
      entries:
        - id: solar-power
          title: "ಮಠದಲ್ಲಿ ಸೌರಶಕ್ತಿ ಅಳವಡಿಕೆ"
          body: "ಹೊಸ ಮೇಲ್ಛಾವಣಿ ಸೌರ ವ್ಯವಸ್ಥೆಯು ಈಗ ಅನ್ನದಾನ ಸಭಾಂಗಣ ಮತ್ತು ಅತಿಥಿ ಗೃಹಕ್ಕೆ ವಿದ್ಯುತ್ ನೀಡುತ್ತಿದೆ, ಮಠದ ವೆಚ್ಚವನ್ನು ಕಡಿಮೆ ಮಾಡುತ್ತದೆ ಮತ್ತು ದೀರ್ಘಕಾಲೀನ ಸುಸ್ಥಿರತೆಯ ಗುರಿಗಳನ್ನು ಬೆಂಬಲಿಸುತ್ತದೆ."
        - id: paryaya-preparations
          title: "ಮುಂದಿನ ಪರ್ಯಾಯಕ್ಕೆ ಸಿದ್ಧತೆ"
          body: "ಪ್ರಸ್ತುತ ಪರ್ಯಾಯ ಅವಧಿಯು ಅರ್ಧದಷ್ಟು ಸಮೀಪಿಸುತ್ತಿದ್ದಂತೆ, ಚಕ್ರದಲ್ಲಿ ಮುಂದಿನ ಮಠಕ್ಕೆ ಪರಿವರ್ತನೆಯನ್ನು ಗುರುತಿಸುವ ಸಮಾರಂಭಗಳಿಗೆ ಸಿದ್ಧತೆಗಳು ಈಗಾಗಲೇ ನಡೆಯುತ್ತಿವೆ."
    - key: symbolism
      title: "ಹಿಂದೂ ದೇವತೆಗಳು, ಆಚರಣೆಗಳು ಮತ್ತು ಪವಿತ್ರ ಸಂಕೇತಗಳ ಅರ್ಥ"
      image: "history-symbolism"
      intro: "ದೈನಂದಿನ ಪೂಜೆಯ ಸಂಕೇತಗಳು ಮತ್ತು ಆಚರಣೆಗಳ ಹಿಂದಿನ ಅರ್ಥವನ್ನು ಅರ್ಥಮಾಡಿಕೊಳ್ಳುವುದು."
      entries:
        - id: shankha-chakra
          title: "ಶಂಖ ಮತ್ತು ಚಕ್ರ"
          body: "ವಿಷ್ಣುವು ಧರಿಸುವ ಶಂಖ ಮತ್ತು ಚಕ್ರವು ಶಬ್ದ ಮತ್ತು ಕಾಲದ ಚಕ್ರವನ್ನು ಪ್ರತಿನಿಧಿಸುತ್ತದೆ — ವೈಷ್ಣವ ಪ್ರತಿಮಾಶಾಸ್ತ್ರದಲ್ಲಿ ಅವನ ಅತ್ಯಂತ ಗುರುತಿಸಬಹುದಾದ ಗುಣಲಕ್ಷಣಗಳಲ್ಲಿ ಎರಡು."
        - id: tulasi
          title: "ತುಳಸಿ ಸಸ್ಯ"
          body: "ತುಳಸಿಯು ವೈಷ್ಣವ ಪೂಜೆಯ ಕೇಂದ್ರವಾಗಿದೆ, ಪ್ರತಿದಿನ ಪೂಜೆಯಲ್ಲಿ ಅರ್ಪಿಸಲ್ಪಡುತ್ತದೆ ಮತ್ತು ವಿಷ್ಣು ಭಕ್ತಿಯಿಂದ ಅವಿಭಾಜ್ಯವೆಂದು ಪರಿಗಣಿಸಲಾಗುತ್ತದೆ."
    - key: remedies
      title: "ಸಮಸ್ಯೆ ಪರಿಹಾರ ಮಂತ್ರಗಳು, ಆಚರಣೆಗಳು ಮತ್ತು ಗುರಿಪಡಿಸಿದ ಸೇವೆಗಳು"
      image: "history-remedies"
      intro: "ಶಾಸ್ತ್ರದಿಂದ ಸಾಮಾನ್ಯ ಜೀವನ ಸವಾಲುಗಳಿಗೆ ಸಾಂಪ್ರದಾಯಿಕ ಪರಿಹಾರಗಳು — ಭಕ್ತ-ಸ್ನೇಹಿ ಅವಲೋಕನಕ್ಕಾಗಿ ಪರಿಹಾರಗಳ ಪುಟವನ್ನೂ ನೋಡಿ."
      entries:
        - id: navagraha-shanti
          title: "ನವಗ್ರಹ ಶಾಂತಿ"
          body: "ಪ್ರತಿಕೂಲ ಗ್ರಹ ಪ್ರಭಾವವನ್ನು ಶಮನಗೊಳಿಸಲು ನಡೆಸುವ ಆಚರಣೆ, ಸಾಮಾನ್ಯವಾಗಿ ಕುಟುಂಬ ಪುರೋಹಿತರು ಅಥವಾ ಜ್ಯೋತಿಷಿಗಳ ಸಮಾಲೋಚನೆಯ ನಂತರ ಶಿಫಾರಸು ಮಾಡಲಾಗುತ್ತದೆ."
        - id: sudarshana-homa
          title: "ಸುದರ್ಶನ ಹೋಮ"
          body: "ಅಡೆತಡೆಗಳ ನಿವಾರಣೆಗಾಗಿ ನಡೆಸುವ ವಿಷ್ಣುವಿನ ರಕ್ಷಣಾತ್ಮಕ ಅಂಶವನ್ನು ಆವಾಹಿಸುವ ಅಗ್ನಿ ಆಚರಣೆ."
    - key: science
      title: "ಹಿಂದೂ ವಿಜ್ಞಾನ ಮತ್ತು ವೈದಿಕ ತತ್ವಶಾಸ್ತ್ರ ಸಂಶೋಧನೆ"
      image: "history-science"
      intro: "ಸಾಂಪ್ರದಾಯಿಕ ಜ್ಞಾನ ವ್ಯವಸ್ಥೆಗಳು ಮತ್ತು ಸಮಕಾಲೀನ ವಿಚಾರಣೆಯ ಛೇದನಗಳನ್ನು ಅನ್ವೇಷಿಸುವುದು."
      entries:
        - id: tatvavada-logic
          title: "ತತ್ವವಾದದ ತಾರ್ಕಿಕ ರಚನೆ"
          body: "ಶ್ರೀ ಮಧ್ವಾಚಾರ್ಯರ ತತ್ವಶಾಸ್ತ್ರವು ಗ್ರಂಥಪ್ರಮಾಣದ ಜೊತೆಗೆ ತಾರ್ಕಿಕ ವಾದದ (ನ್ಯಾಯ) ವ್ಯವಸ್ಥಿತ ಬಳಕೆಯಿಂದ ಗುರುತಿಸಲ್ಪಡುತ್ತದೆ."
        - id: panchanga-astronomy
          title: "ಪಂಚಾಂಗ ಮತ್ತು ಖಗೋಳ ಗಣನೆ"
          body: "ಸಾಂಪ್ರದಾಯಿಕ ಪಂಚಾಂಗವು ಶತಮಾನಗಳಷ್ಟು ಹಳೆಯದಾದ ಖಗೋಳ ಗಣನಾ ವಿಧಾನಗಳನ್ನು ಆಧರಿಸಿದೆ, ಇಂದಿಗೂ ನಿರ್ವಹಿಸಲ್ಪಡುತ್ತದೆ ಮತ್ತು ಪರಿಶೀಲಿಸಲ್ಪಡುತ್ತದೆ."
    - key: pilgrim-guide
      title: "ಯಾತ್ರಾ ಮಾರ್ಗದರ್ಶಿ"
      image: "history-pilgrim-guide"
      intro: "ಶ್ರೀ ಶಿರೂರು ಮಠ ಮತ್ತು ಉಡುಪಿಗೆ ಭೇಟಿ ನೀಡಲು ಯೋಜಿಸುತ್ತಿರುವ ಭಕ್ತರಿಗೆ ಪ್ರಾಯೋಗಿಕ ಮಾಹಿತಿ."
      entries:
        - id: getting-here
          title: "ಇಲ್ಲಿಗೆ ತಲುಪುವುದು"
          body: "ಉಡುಪಿಯು ರೈಲು ಮತ್ತು ರಸ್ತೆಯ ಮೂಲಕ ಚೆನ್ನಾಗಿ ಸಂಪರ್ಕ ಹೊಂದಿದೆ; ಮಠವು ಕಾರ್ ಸ್ಟ್ರೀಟ್‌ನಲ್ಲಿರುವ ಶ್ರೀಕೃಷ್ಣ ಮಠದಿಂದ ಸ್ವಲ್ಪ ದೂರದಲ್ಲಿದೆ."
        - id: where-to-stay
          title: "ಎಲ್ಲಿ ಉಳಿಯುವುದು"
          body: "ಯಾತ್ರಿಕರಿಗೆ ಮಠದ ಆವರಣದಲ್ಲಿ ಅತಿಥಿ ವಸತಿ ಲಭ್ಯವಿದೆ; ಹಬ್ಬದ ಅವಧಿಯಲ್ಲಿ ಮಠದ ಕಚೇರಿಯ ಮೂಲಕ ಮುಂಚಿತವಾಗಿ ಕಾಯ್ದಿರಿಸುವುದನ್ನು ಶಿಫಾರಸು ಮಾಡಲಾಗುತ್ತದೆ."

library:
  heading: "ಗ್ರಂಥಾಲಯ"
  intro: "ಮಾಧ್ವ ಪರಂಪರೆಯಿಂದ ಶ್ಲೋಕಗಳು, ಗ್ರಂಥಗಳು, ದಾಸರ ಪದಗಳು, ಉಪನ್ಯಾಸಗಳು ಮತ್ತು ಆಚರಣಾ ಮಾರ್ಗದರ್ಶನ."
  categories:
    - key: mantras
      title: "ಶ್ಲೋಕ, ಸ್ತೋತ್ರ ಮತ್ತು ಮಂತ್ರಗಳು"
      kn_label: "ಶ್ಲೋಕ ಮಂತ್ರ"
      image: "library-mantras"
      description: "ದೈನಂದಿನ ಪಠಣಗಳು ಮತ್ತು ಭಕ್ತಿಗೀತೆಗಳು, ಲಭ್ಯವಿರುವಲ್ಲಿ ಆಡಿಯೊದೊಂದಿಗೆ."
      items:
        - id: vishnu-sahasranama
          title: "ವಿಷ್ಣು ಸಹಸ್ರನಾಮ"
          subtitle: "ವಿಷ್ಣುವಿನ 1000 ನಾಮಗಳು"
        - id: madhwa-vijaya
          title: "ಮಧ್ವ ವಿಜಯ"
          subtitle: "ಶ್ರೀ ಮಧ್ವಾಚಾರ್ಯರ ಜೀವನದ ಪದ್ಯಗಳು"
        - id: dwadasha-stotra
          title: "ದ್ವಾದಶ ಸ್ತೋತ್ರ"
          subtitle: "ಶ್ರೀ ಮಧ್ವಾಚಾರ್ಯರು ರಚಿಸಿದ ಹನ್ನೆರಡು ಶ್ಲೋಕಗಳು"
    - key: scriptures
      title: "ಗೀತೆ, ವೇದ, ಉಪನಿಷತ್ ಮತ್ತು ಮಹಾಕಾವ್ಯಗಳು"
      kn_label: "ಗೀತೆ ವೇದ"
      image: "library-scriptures"
      description: "ಮಾಧ್ವ ಪರಂಪರೆಯ ವ್ಯಾಖ್ಯಾನದೊಂದಿಗೆ ಪ್ರಮುಖ ಗ್ರಂಥಗಳು."
      items:
        - id: bhagavad-gita
          title: "ಭಗವದ್ಗೀತಾ ಭಾಷ್ಯ"
          subtitle: "ಶ್ರೀ ಮಧ್ವಾಚಾರ್ಯರ ವ್ಯಾಖ್ಯಾನ"
        - id: brahma-sutra
          title: "ಬ್ರಹ್ಮಸೂತ್ರ ಭಾಷ್ಯ"
          subtitle: "ವೇದಾಂತ ಸೂತ್ರಗಳ ವ್ಯಾಖ್ಯಾನ"
        - id: mahabharata-tatparya
          title: "ಮಹಾಭಾರತ ತಾತ್ಪರ್ಯ ನಿರ್ಣಯ"
          subtitle: "ಮಹಾಭಾರತದ ಸಾರ"
    - key: dasara-padas
      title: "ದಾಸರ ಪದಗಳು"
      kn_label: "ದಾಸರ ಪದ"
      image: "library-dasara-padas"
      description: "ಹರಿದಾಸ ಸಂತರ ಭಕ್ತಿಗೀತೆಗಳು, ಆಡಿಯೊವಾಗಿ ಲಭ್ಯ."
      items:
        - id: krishna-nee-begane
          title: "ಕೃಷ್ಣ ನೀ ಬೇಗನೆ ಬಾರೋ"
          subtitle: "ವ್ಯಾಸತೀರ್ಥ"
        - id: bhagyada-lakshmi-baramma
          title: "ಭಾಗ್ಯದ ಲಕ್ಷ್ಮೀ ಬಾರಮ್ಮ"
          subtitle: "ಪುರಂದರ ದಾಸ"
    - key: lectures
      title: "ಉಪನ್ಯಾಸಗಳು ಮತ್ತು ವೀಡಿಯೊಗಳು"
      kn_label: "ಉಪನ್ಯಾಸ"
      image: "library-lectures"
      description: "ಮಠದ ವಿದ್ವಾಂಸರ ಪ್ರವಚನಗಳು ಮತ್ತು ಬೋಧನೆಗಳ ಧ್ವನಿಮುದ್ರಣ."
      items:
        - id: tatvavada-intro
          title: "ತತ್ವವಾದದ ಪರಿಚಯ"
          subtitle: "ಮಾಧ್ವ ತತ್ವಶಾಸ್ತ್ರದ ಪ್ರಾಥಮಿಕ ಪಾಠ"
        - id: paryaya-history
          title: "ಪರ್ಯಾಯ ವ್ಯವಸ್ಥೆಯ ಇತಿಹಾಸ"
          subtitle: "ಎಂಟು ಮಠಗಳು ಹೇಗೆ ಸ್ಥಾಪನೆಯಾದವು"
    - key: rituals
      title: "ಆಚರಣೆಗಳು ಮತ್ತು ಹಬ್ಬಗಳು"
      kn_label: "ಆಚರಣೆ ಹಬ್ಬ"
      image: "library-rituals"
      description: "ಮನೆಯಲ್ಲಿ ಆಚರಣೆಗಳನ್ನು ನಿರ್ವಹಿಸಲು ಮತ್ತು ಹಬ್ಬಗಳನ್ನು ಆಚರಿಸಲು ಹಂತ ಹಂತದ ಮಾರ್ಗದರ್ಶನ."
      items:
        - id: ekadashi-vidhi
          title: "ಏಕಾದಶಿ ವಿಧಿ"
          subtitle: "ಏಕಾದಶಿ ಉಪವಾಸವನ್ನು ಹೇಗೆ ಆಚರಿಸುವುದು"
        - id: griha-pravesha
          title: "ಗೃಹ ಪ್ರವೇಶ ಪೂಜೆ"
          subtitle: "ಗೃಹಪ್ರವೇಶ ಆಚರಣಾ ಮಾರ್ಗದರ್ಶನ"

