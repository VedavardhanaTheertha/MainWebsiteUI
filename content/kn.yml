      description: "ಮಠದ ಸುತ್ತ ವಾರ್ಷಿಕ ರಥಯಾತ್ರೆ, ಎಲ್ಲಾ ಭಕ್ತರಿಗೆ ದರ್ಶನ ಮತ್ತು ಪ್ರಸಾದ."
    - id: ekadashi
      title: "ಏಕಾದಶಿ ಆಚರಣೆ"
      category: "Monthly"
