solutions:
  heading: "ಜೀವನ ಸಮಸ್ಯೆಗಳು ಮತ್ತು ದೈವಿಕ ಪರಿಹಾರಗಳು"
  intro: "ಶಾಸ್ತ್ರದಲ್ಲಿ ಬೇರೂರಿರುವ ಸಾಮಾನ್ಯ ಜೀವನ ಸವಾಲುಗಳಿಗೆ ಸಾಂಪ್ರದಾಯಿಕ ಮಾರ್ಗದರ್ಶನ ಮತ್ತು ಗುರಿಪಡಿಸಿದ ಸೇವೆಗಳು."
  categories:
    - id: navagraha
      glyph: "ग्र"
      title: "ನವಗ್ರಹ ದೋಷ"
      description: "ಪ್ರತಿಕೂಲ ಗ್ರಹ ಪ್ರಭಾವವನ್ನು ಪರಿಹರಿಸುವ ಪರಿಹಾರಗಳು ಮತ್ತು ಸೇವೆಗಳು."
    - id: marriage
      glyph: "ॐ"
      title: "ವಿವಾಹ ಮತ್ತು ಕುಟುಂಬ ಸಾಮರಸ್ಯ"
      description: "ಸಂಬಂಧಗಳಲ್ಲಿ ಶಾಂತಿಯನ್ನು ಪುನಃಸ್ಥಾಪಿಸುವ ಮಾರ್ಗದರ್ಶನ ಮತ್ತು ಆಚರಣೆಗಳು."
    - id: wealth
      glyph: "श्री"
      title: "ಸಂಪತ್ತು ಮತ್ತು ವೃತ್ತಿ"
      description: "ನಿರ್ಬಂಧಿತ ಪ್ರಗತಿಯನ್ನು ಜಯಿಸಲು ಸೇವೆಗಳು ಮತ್ತು ಮಂತ್ರಗಳು."
    - id: general
      glyph: "卐"
      title: "ಸಾಮಾನ್ಯ ಯೋಗಕ್ಷೇಮ"
      description: "ಮನಶ್ಶಾಂತಿ ಮತ್ತು ಆಧ್ಯಾತ್ಮಿಕ ನೆಲೆಗಾಗಿ ದೈನಂದಿನ ಅಭ್ಯಾಸಗಳು."

