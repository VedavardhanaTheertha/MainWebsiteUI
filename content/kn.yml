      image: "event-ekadashi"
      description: "ಏಕಾದಶಿಯಂದು ಆಚರಿಸುವ ಮಾಸಿಕ ಉಪವಾಸ ಮತ್ತು ವಿಶೇಷ ಪೂಜೆ, ಸಂಜೆ ಭಜನೆಗಳೊಂದಿಗೆ."
    - id: krishnashtami
      title: "ಶ್ರೀ ಕೃಷ್ಣ ಜನ್ಮಾಷ್ಟಮಿ"
