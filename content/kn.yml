about:
  mission:
    heading: "ನಮ್ಮ ಧ್ಯೇಯ"
    body: "ಶ್ರೀ ಶಿರೂರು ಮಠವು ಮಾಧ್ವ ಪರಂಪರೆಯ ವೇದಾಂತ ಅಧ್ಯಯನ, ಭಕ್ತಿ ಮತ್ತು ಸೇವೆಯನ್ನು ಸಂರಕ್ಷಿಸಿ ಹಂಚಿಕೊಳ್ಳಲು ಇದೆ — ದೈನಂದಿನ ಪೂಜೆ, ಶಾಸ್ತ್ರಗಳಲ್ಲಿ ವಿದ್ಯಾರ್ಥಿಗಳ ಶಿಕ್ಷಣ, ಸೇವೆ ಮತ್ತು ಅನ್ನದಾನದ ಮೂಲಕ ಸಮುದಾಯದ ಆರೈಕೆ, ಮತ್ತು ಶ್ರೀ ಮಧ್ವಾಚಾರ್ಯರು ಸ್ಥಾಪಿಸಿದ ಪರ್ಯಾಯ ವ್ಯವಸ್ಥೆಯಲ್ಲಿ ನಿಷ್ಠೆಯ ಪಾಲ್ಗೊಳ್ಳುವಿಕೆಯ ಮೂಲಕ."

  chiefSwamiji:
    heading: "ಪ್ರಸ್ತುತ ಆಧ್ಯಾತ್ಮಿಕ ಗುರುಗಳು"
    name: "ಶ್ರೀ ವೇದವರ್ಧನ ತೀರ್ಥರು"
    title: "ಪೀಠಾಧಿಪತಿ, ಶ್ರೀ ಶಿರೂರು ಮಠ"
    description: "ಶ್ರೀ ವೇದವರ್ಧನ ತೀರ್ಥರು ಪ್ರಸ್ತುತ ಶ್ರೀ ಶಿರೂರು ಮಠವನ್ನು ಮುನ್ನಡೆಸುತ್ತಿದ್ದು, ಶ್ರೀಮನ್ ಮಧ್ವಾಚಾರ್ಯರಿಂದ ಬಂದ ಅಖಂಡ ಗುರುಪರಂಪರೆಯನ್ನು ಮುಂದುವರಿಸುತ್ತಿದ್ದಾರೆ."
    portrait: "chief-swamiji"

  paryayaSignificance:
    heading: "ಪರ್ಯಾಯದ ಮಹತ್ವ"
    body: "ಪರ್ಯಾಯವು ಉಡುಪಿಯ ಎಂಟು ಮಠಗಳಲ್ಲಿ ಪ್ರತಿಯೊಂದೂ ಸರದಿಯಂತೆ ಉಡುಪಿ ಶ್ರೀಕೃಷ್ಣ ಮಠದ ಪೂಜೆಯ ಜವಾಬ್ದಾರಿ ವಹಿಸಿಕೊಳ್ಳುವ ಎರಡು ವರ್ಷಗಳ ಚಕ್ರ. ಇದನ್ನು ಸ್ವತಃ ಶ್ರೀ ಮಧ್ವಾಚಾರ್ಯರು ಸ್ಥಾಪಿಸಿದರು. ಶ್ರೀ ಶಿರೂರು ಮಠವು ಈ ಎಂಟು ಅಷ್ಟಮಠಗಳಲ್ಲಿ ಒಂದಾಗಿದೆ."

  udupi:
    heading: "ದಕ್ಷಿಣದ ಕಾಶಿ"
    body: "ಉಡುಪಿಯನ್ನು ದಕ್ಷಿಣದ ಕಾಶಿ ಎಂದು ಪೂಜಿಸಲಾಗುತ್ತದೆ, ಇಲ್ಲಿ ಪುರಾತನ ಚಂದ್ರಮೌಳೀಶ್ವರ ಮತ್ತು ಅನಂತೇಶ್ವರ ದೇವಾಲಯಗಳು ಶ್ರೀಕೃಷ್ಣ ಮಠದೊಂದಿಗೆ ನೆಲೆಸಿವೆ. ಶತಮಾನಗಳಿಂದ ಇದು ವೇದಾಂತ ಅಧ್ಯಯನ ಮತ್ತು ಯಾತ್ರೆಯ ಕೇಂದ್ರವಾಗಿದೆ."

  guruparampara:
    heading: "ಗುರು ಪರಂಪರೆ"
    intro: "ಶತಮಾನಗಳ ದಿವ್ಯ ಸೇವೆ ಮತ್ತು ಜ್ಞಾನದ ಮೂಲಕ ಶ್ರೀ ಶಿರೂರು ಮಠವನ್ನು ಮುನ್ನಡೆಸಿದ ಆಧ್ಯಾತ್ಮಿಕ ಗುರುಗಳ ಪವಿತ್ರ ಪರಂಪರೆ."
    entries:
      - order: 1
        name: "ಶ್ರೀ ಮಧ್ವಾಚಾರ್ಯರು"
        title: "ಮಾಧ್ವ ಪರಂಪರೆಯ ಸ್ಥಾಪಕರು"
        description: "ಬ್ರಹ್ಮಸೂತ್ರ, ಉಪನಿಷತ್, ಭಗವದ್ಗೀತೆ ಮತ್ತು ಇತರ ಪವಿತ್ರ ಗ್ರಂಥಗಳ ಭಾಷ್ಯಗಳ ಮೂಲಕ ಶುದ್ಧ ಭಕ್ತಿಯ ಮಾರ್ಗವನ್ನು (ತತ್ವವಾದ) ಸ್ಥಾಪಿಸಿದ ದಿವ್ಯ ಅವತಾರ."
        portrait: "guru-01"
      - order: 2
        name: "ಶ್ರೀ ವಾಮನ ತೀರ್ಥರು"
        title: "ಪರಂಪರೆಯಲ್ಲಿ ಎರಡನೆಯವರು"
        description: "ಸ್ಥಾಪಕರ ಬೋಧನೆಗಳನ್ನು ಮುಂದುವರಿಸಿ ಮಠದ ಆರಂಭಿಕ ಸಂಪ್ರದಾಯಗಳನ್ನು ಸ್ಥಾಪಿಸಿದ ನೇರ ಶಿಷ್ಯರು."
        portrait: "guru-02"
      - order: 3
        name: "ಶ್ರೀ ವಾಸುದೇವ ತೀರ್ಥರು"
        title: "ಪರಂಪರೆಯಲ್ಲಿ ಮೂರನೆಯವರು"
        description: "ತಮ್ಮ ಪೂರ್ವಾಧಿಕಾರಿಗಳು ಸ್ಥಾಪಿಸಿದ ಜ್ಞಾನ ಮತ್ತು ಪೂಜಾ ಸಂಪ್ರದಾಯವನ್ನು ಮುಂದುವರಿಸಿದರು."
        portrait: "guru-03"
      - order: 31
        name: "ಶ್ರೀ ವೇದವರ್ಧನ ತೀರ್ಥರು"
        title: "ಪ್ರಸ್ತುತ ಆಧ್ಯಾತ್ಮಿಕ ಗುರುಗಳು"
        description: "ಶ್ರೀಮನ್ ಮಧ್ವಾಚಾರ್ಯರಿಂದ ಬಂದ ಅಖಂಡ ಗುರುಪರಂಪರೆಯನ್ನು ಮುಂದುವರಿಸುತ್ತಾ, ಪ್ರಸ್ತುತ ಶ್ರೀ ಶಿರೂರು ಮಠವನ್ನು ಮುನ್ನಡೆಸುತ್ತಿದ್ದಾರೆ."
        portrait: "chief-swamiji"

events:
  heading: "ಕಾರ್ಯಕ್ರಮಗಳು"
  intro: "ಶ್ರೀ ಶಿರೂರು ಮಠದಲ್ಲಿ ಹಬ್ಬಗಳು, ಆಚರಣೆಗಳು ಮತ್ತು ಸಮುದಾಯ ಕಾರ್ಯಕ್ರಮಗಳು."
  categories: ["Monthly", "Annual", "Special"]
  list:
    - id: rathotsava
